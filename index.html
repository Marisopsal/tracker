<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dagbok</title>
  <meta name="description" content="Enkel dagbok for vondt i magen og hodet. Alt lagres bare på telefonen.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dagbok">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Liten tittel i en glasslinje, som kommer frem når den store tittelen er blad forbi. -->
  <div class="navlinje" id="navlinje" aria-hidden="true">
    <span class="navlinje-tittel" id="navlinje-tittel">I dag</span>
  </div>

  <button id="knapp-innstillinger" class="rundknapp glass innstillingsknapp" aria-label="Innstillinger og sikkerhetskopi">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </button>

  <main>
    <header class="storhode">
      <p class="overtittel" id="overtittel"></p>
      <h1 id="tittel">I dag</h1>
    </header>
    <section id="vis-idag" aria-labelledby="tittel"></section>
    <section id="vis-kalender" aria-labelledby="tittel" hidden></section>
  </main>

  <nav class="fanelinje glass" aria-label="Hovedmeny">
    <button data-visning="idag" aria-current="page">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <mask id="maske-idag">
          <rect width="28" height="28" fill="#fff"/>
          <path d="M14 8.5v11M8.5 14h11" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
        </mask>
        <circle cx="14" cy="14" r="11.5" fill="currentColor" mask="url(#maske-idag)"/>
      </svg>
      <span>I dag</span>
    </button>
    <button data-visning="kalender">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <mask id="maske-kalender">
          <rect width="28" height="28" fill="#fff"/>
          <rect x="5.75" y="11" width="16.5" height="11.25" rx="2" fill="#000"/>
          <rect x="8.25" y="13.25" width="3" height="3" rx=".8" fill="#fff"/>
          <rect x="12.5" y="13.25" width="3" height="3" rx=".8" fill="#fff"/>
          <rect x="16.75" y="13.25" width="3" height="3" rx=".8" fill="#fff"/>
          <rect x="8.25" y="17.5" width="3" height="3" rx=".8" fill="#fff"/>
          <rect x="12.5" y="17.5" width="3" height="3" rx=".8" fill="#fff"/>
        </mask>
        <rect x="3.5" y="5" width="21" height="19.5" rx="4.5" fill="currentColor" mask="url(#maske-kalender)"/>
        <rect x="8.5" y="2.75" width="2.5" height="5" rx="1.25" fill="currentColor"/>
        <rect x="17" y="2.75" width="2.5" height="5" rx="1.25" fill="currentColor"/>
      </svg>
      <span>Kalender</span>
    </button>
  </nav>

  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
  <dialog id="ark" class="ark"></dialog>
  <dialog id="varsel" class="varsel glass"></dialog>

  <!-- Gir et lite dunk i hånden på iPhone (iOS 18 og nyere) når appen trykker på den. -->
  <label id="haptikk" class="haptikk" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <noscript><p>Dagbok trenger JavaScript for å virke.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
